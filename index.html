<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKVATOR - Voice & Video Call App</title>
    <!-- ZegoCloud Prebuilt UIKit Global Script -->
    <script src="https://zegocloud.github.io/zego_uikit_prebuilt_web/zego_uikit_prebuilt_web.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #app {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h2, h3 { color: #38bdf8; text-align: center; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button.action-btn {
            width: 100%;
            padding: 10px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button.action-btn:hover { opacity: 0.9; }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .call-btns button {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 14px;
        }
        .btn-video { background: #3b82f6; color: white; }
        .btn-voice { background: #22c55e; color: white; }
        #call-container {
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #0f172a;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="app">
    <h2>IKVATOR</h2>
    <div id="reg-section">
        <input type="text" id="username" placeholder="Enter your name to register">
        <button class="action-btn" id="register-btn">Register</button>
    </div>

    <h3>Active Users</h3>
    <div id="user-list">Loading users...</div>
</div>

<!-- Calling Screen Container -->
<div id="call-container"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZpVGl3pinRuoXWsKLObSyl1HvOgWC6iQ",
        authDomain: "ikvator-5e95d.firebaseapp.com",
        projectId: "ikvator-5e95d",
        storageBucket: "ikvator-5e95d.firebasestorage.app",
        messagingSenderId: "746614843215",
        appId: "1:746614843215:web:8b7ef8860cb11b3128c73a",
        measurementId: "G-EF0EKC7S62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let myName = "";

    // Register Button Event Listener
    document.getElementById("register-btn").addEventListener("click", async () => {
        const nameInput = document.getElementById("username").value.trim();
        if (!nameInput) {
            alert("Please enter your name!");
            return;
        }
        myName = nameInput;
        try {
            await addDoc(collection(db, "users"), { name: myName });
            alert("Registered successfully!");
            document.getElementById("reg-section").style.display = "none";
        } catch (error) {
            console.error("Firebase Registration Error: ", error);
            alert("Registration failed! Check console.");
        }
    });

    // Real-time Users Fetching
    onSnapshot(collection(db, "users"), (snapshot) => {
        const listDiv = document.getElementById("user-list");
        listDiv.innerHTML = "";
        
        if (snapshot.empty) {
            listDiv.innerHTML = "<p style='color: #94a3b8; text-align: center;'>No users found.</p>";
            return;
        }

        snapshot.forEach((doc) => {
            const userData = doc.data();
            
            const userItem = document.createElement("div");
            userItem.className = "user-item";
            userItem.innerHTML = `
                <span>👤 ${userData.name}</span>
                <div class="call-btns">
                    <button class="btn-video">📹 Video</button>
                    <button class="btn-voice">📞 Voice</button>
                </div>
            `;

            // Attach event listeners safely to dynamically created buttons
            userItem.querySelector(".btn-video").addEventListener("click", () => {
                startCall(userData.name, 'Video');
            });
            userItem.querySelector(".btn-voice").addEventListener("click", () => {
                startCall(userData.name, 'Voice');
            });

            listDiv.appendChild(userItem);
        });
    });

    function startCall(targetUserName, callType) {
        if (!myName) {
            alert("Pehle upar apna naam daal kar Register karein!");
            return;
        }

        if (typeof ZegoUIKitPrebuilt === 'undefined') {
            alert("Zego SDK load nahi ho paya. Page refresh karein!");
            return;
        }

        const roomID = "IKVATOR_ROOM_" + [myName, targetUserName].sort().join("_");
        const userID = "user_" + Math.floor(Math.random() * 100000);
        
        const appID = 543623560; 
        const serverSecret = "50c109514dc9d2ff05344c803e6a8628"; 

        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, myName);
        const zp = ZegoUIKitPrebuilt.create(kitToken);

        document.getElementById("call-container").style.display = "block";

        zp.joinRoom({
            container: document.querySelector("#call-container"),
            scenario: {
                mode: callType === 'Video' ? ZegoUIKitPrebuilt.VideoCall : ZegoUIKitPrebuilt.OneONoneCall,
            },
            onLeaveRoom: () => {
                document.getElementById("call-container").style.display = "none";
                window.location.reload();
            },
        });
    }
</script>

</body>
</html>
